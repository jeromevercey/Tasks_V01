<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explorance — Employee Experience Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ------------------------------------------------------------------
       Brand tokens — swap these for Explorance's exact brand values.
       ------------------------------------------------------------------ */
    :root {
      --ex-navy: #0b1f3a;
      --ex-ink: #13243d;
      --ex-muted: #5b6b82;
      --ex-line: #dfe5ee;
      --ex-accent: #00a3a1;
      --ex-accent-2: #4f6bff;
      --ex-bg: #f5f7fb;
      --ex-card: #ffffff;
      --ex-radius: 20px;
      --ex-duration: 6000ms; /* autoplay time per item */
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--ex-ink);
      background: var(--ex-bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------------- Section ---------------- */
    .ex-vc {
      padding: 96px 24px;
    }
    .ex-vc__inner {
      max-width: 1200px;
      margin: 0 auto;
    }
    .ex-vc__header {
      max-width: 760px;
      margin: 0 auto 64px;
      text-align: center;
    }
    .ex-vc__eyebrow {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ex-accent);
      margin-bottom: 16px;
    }
    .ex-vc__title {
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--ex-navy);
      margin: 0 0 20px;
    }
    .ex-vc__lead {
      font-size: 18px;
      line-height: 1.6;
      color: var(--ex-muted);
      margin: 0;
    }

    .ex-vc__grid {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 64px;
      align-items: center;
    }

    /* ---------------- Left: tab list ---------------- */
    .ex-vc__list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .ex-vc__item {
      position: relative;
      padding-left: 28px;
      border-bottom: 1px solid var(--ex-line);
    }
    .ex-vc__item:last-child { border-bottom: 0; }

    /* vertical progress track */
    .ex-vc__track {
      position: absolute;
      left: 0;
      top: 22px;
      bottom: 22px;
      width: 3px;
      border-radius: 3px;
      background: var(--ex-line);
      overflow: hidden;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .ex-vc__fill {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--ex-accent), var(--ex-accent-2));
      transform: scaleY(0);
      transform-origin: top;
    }
    .ex-vc__item.is-active .ex-vc__track { opacity: 1; }
    .ex-vc__item.is-active .ex-vc__fill {
      animation: ex-fill var(--ex-duration) linear forwards;
    }
    .ex-vc.is-paused .ex-vc__item.is-active .ex-vc__fill,
    .ex-vc.is-manual .ex-vc__item.is-active .ex-vc__fill {
      animation-play-state: paused;
    }
    .ex-vc.is-manual .ex-vc__item.is-active .ex-vc__fill {
      animation: none;
      transform: scaleY(1);
    }
    @keyframes ex-fill { to { transform: scaleY(1); } }

    .ex-vc__tab {
      all: unset;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 22px 0;
      cursor: pointer;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--ex-muted);
      transition: color .25s ease;
    }
    .ex-vc__tab:hover,
    .ex-vc__item.is-active .ex-vc__tab { color: var(--ex-navy); }
    .ex-vc__tab:focus-visible {
      outline: 2px solid var(--ex-accent);
      outline-offset: 4px;
      border-radius: 6px;
    }
    .ex-vc__num {
      flex: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--ex-accent);
      font-variant-numeric: tabular-nums;
      opacity: .55;
      transition: opacity .25s ease;
    }
    .ex-vc__item.is-active .ex-vc__num { opacity: 1; }

    /* expanding body (grid-rows trick = smooth height animation) */
    .ex-vc__body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .45s cubic-bezier(.2,.7,.2,1);
    }
    .ex-vc__item.is-active .ex-vc__body { grid-template-rows: 1fr; }
    .ex-vc__body-inner {
      overflow: hidden;
      padding-left: 34px;
    }
    .ex-vc__text {
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.65;
      color: var(--ex-muted);
    }
    .ex-vc__link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ex-accent);
      text-decoration: none;
    }
    .ex-vc__link svg { transition: transform .2s ease; }
    .ex-vc__link:hover svg { transform: translateX(4px); }
    .ex-vc__mobile-media { display: none; }

    /* ---------------- Right: vertical media stage ---------------- */
    .ex-vc__stage {
      position: relative;
      aspect-ratio: 7 / 6;
      border-radius: calc(var(--ex-radius) + 8px);
      background:
        radial-gradient(120% 90% at 100% 0%, rgba(79,107,255,.22), transparent 60%),
        radial-gradient(100% 80% at 0% 100%, rgba(0,163,161,.22), transparent 60%),
        var(--ex-navy);
      overflow: hidden;
    }
    .ex-vc__reel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: transform .8s cubic-bezier(.65,0,.35,1);
      will-change: transform;
    }
    .ex-vc__slide {
      flex: 0 0 100%;
      display: grid;
      place-items: center;
      padding: 8%;
    }
    .ex-vc__slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: var(--ex-radius);
    }
    /* soft fade on the top and bottom edges while sliding */
    .ex-vc__stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, var(--ex-navy) 0%, transparent 10%, transparent 90%, var(--ex-navy) 100%);
      opacity: .6;
    }
    .ex-vc__dots {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 2;
    }
    .ex-vc__dot {
      width: 6px;
      height: 6px;
      border-radius: 6px;
      background: rgba(255,255,255,.35);
      transition: height .3s ease, background .3s ease;
    }
    .ex-vc__dot.is-active { height: 22px; background: #fff; }

    /* ---------------- Built-in mock visual (used when no image URL) ---------------- */
    .ex-mock {
      width: 100%;
      background: var(--ex-card);
      border-radius: var(--ex-radius);
      box-shadow: 0 30px 60px -20px rgba(0,0,0,.45);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .ex-mock__bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ex-mock__bar i {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--ex-line);
    }
    .ex-mock__bar span {
      margin-left: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ex-muted);
    }
    .ex-mock__row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      align-items: end;
    }
    .ex-mock__stat {
      font-size: clamp(34px, 4vw, 52px);
      font-weight: 800;
      letter-spacing: -.03em;
      color: var(--ex-navy);
      line-height: 1;
    }
    .ex-mock__stat small {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--ex-muted);
    }
    .ex-mock__chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 110px;
    }
    .ex-mock__chart b {
      flex: 1;
      border-radius: 6px 6px 2px 2px;
      background: linear-gradient(180deg, var(--ex-accent-2), var(--ex-accent));
      opacity: .85;
      transform-origin: bottom;
    }
    .ex-vc__slide.is-active .ex-mock__chart b {
      animation: ex-grow .9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes ex-grow { from { transform: scaleY(.1); } }
    .ex-mock__chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ex-mock__chips span {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--ex-bg);
      color: var(--ex-ink);
      border: 1px solid var(--ex-line);
    }

    /* ---------------- Mobile: accordion with inline media ---------------- */
    @media (max-width: 900px) {
      .ex-vc { padding: 64px 16px; }
      .ex-vc__header { margin-bottom: 40px; }
      .ex-vc__grid { grid-template-columns: 1fr; gap: 0; }
      .ex-vc__stage { display: none; }
      .ex-vc__tab { font-size: 18px; }
      .ex-vc__body-inner { padding-left: 0; }
      .ex-vc__mobile-media {
        display: block;
        margin-bottom: 24px;
        border-radius: var(--ex-radius);
        padding: 20px;
        background: var(--ex-navy);
        overflow: hidden;
      }
      .ex-vc__mobile-media img { width: 100%; display: block; border-radius: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ex-vc__reel, .ex-vc__body { transition: none; }
      .ex-vc__item.is-active .ex-vc__fill { animation: none; transform: scaleY(1); }
      .ex-vc__slide.is-active .ex-mock__chart b { animation: none; }
    }
  </style>
</head>
<body>

  <section class="ex-vc" id="ex-vc" aria-labelledby="ex-vc-title">
    <div class="ex-vc__inner">
      <header class="ex-vc__header">
        <span class="ex-vc__eyebrow">Employee Experience</span>
        <h2 class="ex-vc__title" id="ex-vc-title">Build an Employee Experience that Boosts Revenue and Grows Your Business</h2>
        <p class="ex-vc__lead">Use the voice of your employees to future-proof your business and fuel effective professional development with dynamic feedback analysis.</p>
      </header>

      <div class="ex-vc__grid">
        <ol class="ex-vc__list" role="tablist" aria-orientation="vertical"></ol>
        <div class="ex-vc__stage" aria-hidden="true">
          <div class="ex-vc__reel"></div>
          <div class="ex-vc__dots"></div>
        </div>
      </div>
    </div>
  </section>

  <script>
  (function () {
    /* --------------------------------------------------------------
       CAROUSEL CONTENT — edit this array.
       - image: optional URL to a screenshot/illustration. When empty,
         a built-in mock card is rendered from `mock`.
       -------------------------------------------------------------- */
    var ITEMS = [
      {
        title: "Measure and boost employee engagement",
        text: "Run engagement and pulse surveys that employees actually answer, then turn results into clear action plans that keep your top performers and lift productivity.",
        cta: "Explore employee engagement",
        href: "https://www.explorance.com/solutions/employee-engagement/",
        image: "",
        mock: { label: "Engagement dashboard", stat: "+17%", statLabel: "Productivity", bars: [38, 52, 47, 64, 71, 83, 92], chips: ["Pulse surveys", "Action plans", "Benchmarks"] }
      },
      {
        title: "Improve the moments that matter",
        text: "Capture feedback across the entire employee journey — from hiring and onboarding to development and exit — and fix friction before it becomes turnover.",
        cta: "Explore employee experience",
        href: "https://www.explorance.com/solutions/employee-experience/",
        image: "",
        mock: { label: "Lifecycle insights", stat: "-59%", statLabel: "Voluntary turnover", bars: [90, 78, 70, 58, 49, 41, 36], chips: ["Hiring", "Onboarding", "Exit"] }
      },
      {
        title: "Develop leaders with 360° feedback",
        text: "Give managers and leaders a well-rounded view of their strengths and blind spots with 360-degree feedback that fuels effective professional development.",
        cta: "Explore 360 feedback",
        href: "https://www.explorance.com/lp/360-feedback-platform",
        image: "",
        mock: { label: "360° leadership report", stat: "4.6/5", statLabel: "Leadership score", bars: [60, 72, 55, 80, 68, 88, 76], chips: ["Self", "Peers", "Direct reports", "Manager"] }
      },
      {
        title: "Analyze every comment with purpose-built AI",
        text: "Generate high-quality insights in minutes. Purpose-built AI analyzes hundreds of thousands of open-ended comments at once to surface themes, sentiment and recommendations.",
        cta: "Explore AI comment analysis",
        href: "https://explorance.com/solutions/employee-experience-management/stepwise-feedback/",
        image: "",
        mock: { label: "Comment analysis", stat: "250K+", statLabel: "Comments analyzed", bars: [30, 45, 62, 58, 74, 86, 95], chips: ["Themes", "Sentiment", "Recommendations"] }
      },
      {
        title: "Connect feedback to the systems you already use",
        text: "Pull key organizational data from your existing HRIS, LMS or CRM with seamless integrations, so insights reach the right people without extra work.",
        cta: "See integrations",
        href: "https://www.explorance.com/solutions/employee-experience/",
        image: "",
        mock: { label: "Integrations", stat: "+21%", statLabel: "Profitability", bars: [44, 50, 57, 63, 70, 78, 85], chips: ["HRIS", "LMS", "CRM", "SSO"] }
      }
    ];

    var root = document.getElementById("ex-vc");
    var list = root.querySelector(".ex-vc__list");
    var reel = root.querySelector(".ex-vc__reel");
    var dotsEl = root.querySelector(".ex-vc__dots");
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var duration = parseFloat(getComputedStyle(root).getPropertyValue("--ex-duration")) || 6000;

    var arrow = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10m0 0L9 4m4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function media(item) {
      if (item.image) return '<img src="' + esc(item.image) + '" alt="" loading="lazy" />';
      var m = item.mock;
      return '<div class="ex-mock">' +
        '<div class="ex-mock__bar"><i></i><i></i><i></i><span>' + esc(m.label) + '</span></div>' +
        '<div class="ex-mock__row">' +
          '<div class="ex-mock__stat">' + esc(m.stat) + '<small>' + esc(m.statLabel) + '</small></div>' +
          '<div class="ex-mock__chart">' + m.bars.map(function (h, i) {
            return '<b style="height:' + h + '%;animation-delay:' + (i * 60) + 'ms"></b>';
          }).join("") + '</div>' +
        '</div>' +
        '<div class="ex-mock__chips">' + m.chips.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join("") + '</div>' +
      '</div>';
    }

    // ---- render ----
    list.innerHTML = ITEMS.map(function (item, i) {
      var n = String(i + 1).padStart(2, "0");
      return '<li class="ex-vc__item">' +
        '<span class="ex-vc__track"><span class="ex-vc__fill"></span></span>' +
        '<button class="ex-vc__tab" role="tab" id="ex-vc-tab-' + i + '" aria-controls="ex-vc-panel-' + i + '">' +
          '<span class="ex-vc__num">' + n + '</span><span>' + esc(item.title) + '</span>' +
        '</button>' +
        '<div class="ex-vc__body" role="tabpanel" id="ex-vc-panel-' + i + '" aria-labelledby="ex-vc-tab-' + i + '">' +
          '<div class="ex-vc__body-inner">' +
            '<p class="ex-vc__text">' + esc(item.text) + '</p>' +
            '<div class="ex-vc__mobile-media">' + media(item) + '</div>' +
            '<a class="ex-vc__link" href="' + esc(item.href) + '">' + esc(item.cta) + arrow + '</a>' +
          '</div>' +
        '</div>' +
      '</li>';
    }).join("");

    // the first slide is repeated at the end so the reel can keep sliding
    // down from the last item back to the first (seamless loop)
    reel.innerHTML = ITEMS.concat(ITEMS[0]).map(function (item) {
      return '<div class="ex-vc__slide">' + media(item) + '</div>';
    }).join("");
    dotsEl.innerHTML = ITEMS.map(function () { return '<span class="ex-vc__dot"></span>'; }).join("");

    var items = list.querySelectorAll(".ex-vc__item");
    var tabs = list.querySelectorAll(".ex-vc__tab");
    var panels = list.querySelectorAll(".ex-vc__body");
    var slides = reel.querySelectorAll(".ex-vc__slide");
    var dots = dotsEl.querySelectorAll(".ex-vc__dot");

    var current = -1;
    var timer = null;
    var remaining = duration;
    var startedAt = 0;
    var paused = false;
    var inView = false;

    var reelPos = 0;
    function moveReel(pos, animate) {
      reelPos = pos;
      reel.style.transition = animate ? "" : "none";
      reel.style.transform = "translateY(" + (-100 * pos) + "%)";
      if (!animate) void reel.offsetHeight;
    }

    // wrap = true when looping forward from the last item to the first
    function setActive(index, wrap) {
      current = index;
      var pos = wrap ? ITEMS.length : index;
      for (var s = 0; s < slides.length; s++) {
        slides[s].classList.toggle("is-active", s === pos);
      }
      for (var i = 0; i < ITEMS.length; i++) {
        var on = i === index;
        items[i].classList.toggle("is-active", on);
        dots[i].classList.toggle("is-active", on);
        tabs[i].setAttribute("aria-selected", on ? "true" : "false");
        tabs[i].tabIndex = on ? 0 : -1;
        panels[i].setAttribute("aria-hidden", on ? "false" : "true");
        panels[i].querySelectorAll("a").forEach(function (a) { a.tabIndex = on ? 0 : -1; });
        // restart the CSS progress animation
        var fill = items[i].querySelector(".ex-vc__fill");
        fill.style.animation = "none";
        void fill.offsetWidth;
        fill.style.animation = "";
      }
      // still parked on the cloned first slide: snap to the real one
      // (identical visual) before animating to the next position
      if (reelPos === ITEMS.length) moveReel(0, false);
      moveReel(pos, !reduceMotion);
    }

    // after sliding onto the cloned first slide, jump back to the real one
    reel.addEventListener("transitionend", function (e) {
      if (e.target !== reel || reelPos !== ITEMS.length) return;
      moveReel(0, false);
      slides[ITEMS.length].classList.remove("is-active");
      slides[0].classList.add("is-active");
    });

    // ---- autoplay (JS timer kept in sync with the CSS progress bar) ----
    function schedule(ms) {
      clearTimeout(timer);
      startedAt = Date.now();
      remaining = ms;
      timer = setTimeout(function () {
        var next = (current + 1) % ITEMS.length;
        setActive(next, next === 0);
        schedule(duration);
      }, ms);
    }
    function pause() {
      if (paused || root.classList.contains("is-manual")) return;
      paused = true;
      clearTimeout(timer);
      remaining = Math.max(0, remaining - (Date.now() - startedAt));
      root.classList.add("is-paused");
    }
    function resume() {
      if (!paused || !inView || root.classList.contains("is-manual")) return;
      paused = false;
      root.classList.remove("is-paused");
      schedule(remaining);
    }
    function stopAutoplay() {
      clearTimeout(timer);
      root.classList.add("is-manual");
    }
    // visitor picked an item: show it for a full cycle, then keep looping
    function goTo(index) {
      setActive(index);
      remaining = duration;
      if (!paused && !root.classList.contains("is-manual")) schedule(duration);
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener("click", function () {
        goTo(i);
      });
      tab.addEventListener("keydown", function (e) {
        var next = null;
        if (e.key === "ArrowDown" || e.key === "ArrowRight") next = (i + 1) % ITEMS.length;
        if (e.key === "ArrowUp" || e.key === "ArrowLeft") next = (i - 1 + ITEMS.length) % ITEMS.length;
        if (e.key === "Home") next = 0;
        if (e.key === "End") next = ITEMS.length - 1;
        if (next === null) return;
        e.preventDefault();
        goTo(next);
        tabs[next].focus();
      });
    });

    root.querySelector(".ex-vc__grid").addEventListener("mouseenter", pause);
    root.querySelector(".ex-vc__grid").addEventListener("mouseleave", resume);
    root.addEventListener("focusin", pause);
    root.addEventListener("focusout", function (e) {
      if (!root.contains(e.relatedTarget)) resume();
    });

    setActive(0);

    if (reduceMotion) {
      stopAutoplay();
    } else if ("IntersectionObserver" in window) {
      // only run autoplay while the section is on screen
      paused = true;
      root.classList.add("is-paused");
      new IntersectionObserver(function (entries) {
        inView = entries[0].isIntersecting;
        if (inView) resume(); else pause();
      }, { threshold: 0.35 }).observe(root);
    } else {
      inView = true;
      schedule(duration);
    }
  })();
  </script>
</body>
</html>
